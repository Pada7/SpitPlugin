name: SpitPlugin
version: '${project.version}'
main: hex.wald.spitplugin.SpitPlugin
api-version: '26.3'
description: Spit like a llama - launches llama spit projectiles with particle effects.
author: HexWald
website: https://github.com/Pada7/SpitPlugin

commands:
  spit:
    description: Shoot a spit projectile
    usage: /spit
  spitmenu:
    description: Open the spit type selection menu
    usage: /spitmenu

permissions:
  spit.use:
    description: Allows using /spit and /spitmenu
    default: true
