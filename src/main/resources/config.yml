# ==========================================================
#  SpitPlugin 配置文件
#
#  修改后需要重启服务器（或用插件管理器重载本插件）才会生效。
# ==========================================================

# ---------- 自定义指令 ----------
command:
  # 主命令名，不带斜杠。例如改成 tukou，玩家就用 /tukou 吐口水
  name: spit

  # 命令别名，可以写多个；不需要就写成 aliases: []
  aliases:
    - spitout

  # 使用命令需要的权限节点；留空（permission: ''）表示不检查权限
  permission: spit.use

  # 命令描述，会显示在 /help 里
  description: 朝准星方向吐一口口水

  # 用法提示，%command% 会被替换成上面的命令名
  usage: /%command%

# ---------- 提示文本（支持 & 颜色代码） ----------
messages:
  players-only: '&e该命令只能由游戏内玩家执行。'
  no-permission: '&c你没有权限使用这个命令。'
